<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat | Seraph</title>
    <link rel="shortcut icon" href="../../images/ico.ico" type="image/x-icon">
    <script src="../../storage/js/cloak.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #212121;
            color: #e3e3e3;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            background: #171717;
            border-bottom: 1px solid #333;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #8b5cf6, #10b981);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-icon svg {
            width: 20px;
            height: 20px;
            stroke: white;
        }
        
        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }
        
        .header-subtitle {
            font-size: 11px;
            color: #888;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .model-select {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #e3e3e3;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .model-select:focus {
            outline: none;
            border-color: #10b981;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .empty-state-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #8b5cf6, #10b981);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .empty-state-icon svg {
            width: 24px;
            height: 24px;
            stroke: white;
        }
        
        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .example-prompts {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .example-prompt {
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            color: #ccc;
            transition: background 0.2s, border-color 0.2s;
        }
        
        .example-prompt:hover {
            background: #333;
            border-color: #10b981;
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto 20px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .avatar.user {
            background: #10b981;
        }
        
        .avatar.assistant {
            background: #8b5cf6;
        }
        
        .message-content {
            flex: 1;
            line-height: 1.6;
        }
        
        .message-content p {
            margin-bottom: 12px;
        }
        
        .message-content p:last-child {
            margin-bottom: 0;
        }
        
        .message-content pre {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 12px 0;
        }
        
        .message-content code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .message-content pre code {
            background: none;
            padding: 0;
        }
        
        .message-image {
            max-width: 300px;
            border-radius: 8px;
            margin: 8px 0;
        }
        
        .input-container {
            background: #171717;
            border-top: 1px solid #333;
            padding: 16px 20px;
        }
        
        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .image-previews {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .image-preview-item {
            position: relative;
        }
        
        .image-preview-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .image-preview-item button {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: #ef4444;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .input-area {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 12px;
        }
        
        .input-area:focus-within {
            border-color: #10b981;
        }
        
        .upload-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .upload-btn:hover {
            color: #e3e3e3;
        }
        
        .upload-btn svg {
            width: 20px;
            height: 20px;
        }
        
        #imageInput {
            display: none;
        }
        
        #messageInput {
            flex: 1;
            background: none;
            border: none;
            color: #e3e3e3;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 150px;
        }
        
        #messageInput::placeholder {
            color: #666;
        }
        
        .send-btn {
            background: #10b981;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .send-btn:hover {
            background: #059669;
        }
        
        .send-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
        
        .send-btn svg {
            width: 16px;
            height: 16px;
        }
        
        .loading {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .loading span {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div>
                    <h1>Seraph Assistant</h1>
                    <div class="header-subtitle">AI-powered assistant</div>
                </div>
            </div>
            <div class="header-right">
                <select id="modelSelect" class="model-select">
                    <option value="openai/gpt-5-nano">GPT-5 Nano</option>
                    <option value="openai/gpt-4.1-nano">GPT-4.1 Nano</option>
                    <option value="google/gemini-2.0-flash-lite-001">Gemini 2.0 Flash Lite</option>
                    <option value="google/gemma-3-27b-it">Gemma 3 27B</option>
                    <option value="amazon/nova-2-lite-v1:free">Amazon Nova 2 Lite (Free)</option>
                    <option value="amazon/nova-lite-v1">Amazon Nova Lite</option>
                </select>
            </div>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h2>Seraph Assistant</h2>
                <p>AI-powered help for writing, research, coding, and more</p>
                <div class="example-prompts">
                    <div class="example-prompt" onclick="usePrompt('Summarize the key points of a YouTube video')">→ Summarize a YouTube video</div>
                    <div class="example-prompt" onclick="usePrompt('Help me write a Discord bot command')">→ Write a Discord bot command</div>
                    <div class="example-prompt" onclick="usePrompt('Improve the copy for my landing page')">→ Improve my landing page copy</div>
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <div class="image-previews" id="imagePreviews"></div>
                <div class="input-area">
                    <label class="upload-btn" for="imageInput">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                    </label>
                    <input type="file" id="imageInput" accept="image/*" multiple>
                    <textarea id="messageInput" placeholder="Ask anything..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
        const API_KEY = typeof OPENROUTER_API_KEY !== 'undefined' ? OPENROUTER_API_KEY : '';
        
        if (!API_KEY) {
            console.error('API key not found. Create config.js with: const OPENROUTER_API_KEY = "your-key";');
        }
        
        let selectedModel = 'openai/gpt-5-nano';
        let selectedImages = [];
        let messageHistory = [];
        
        const chatContainer = document.getElementById('chatContainer');
        const emptyState = document.getElementById('emptyState');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageInput = document.getElementById('imageInput');
        const imagePreviews = document.getElementById('imagePreviews');
        const modelSelect = document.getElementById('modelSelect');
        
        modelSelect.addEventListener('change', (e) => {
            selectedModel = e.target.value;
        });
        
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        imageInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        selectedImages.push(e.target.result);
                        renderImagePreviews();
                    };
                    reader.readAsDataURL(file);
                }
            });
            imageInput.value = '';
        });
        
        function renderImagePreviews() {
            imagePreviews.innerHTML = selectedImages.map((img, i) => `
                <div class="image-preview-item">
                    <img src="${img}" alt="Preview">
                    <button onclick="removeImage(${i})">×</button>
                </div>
            `).join('');
        }
        
        function removeImage(index) {
            selectedImages.splice(index, 1);
            renderImagePreviews();
        }
        
        function usePrompt(text) {
            messageInput.value = text;
            messageInput.focus();
        }
        
        function addMessage(role, content, images = []) {
            if (emptyState) emptyState.style.display = 'none';
            
            const div = document.createElement('div');
            div.className = 'message';
            
            let imagesHtml = images.map(img => `<img src="${img}" class="message-image">`).join('');
            let contentHtml = content;
            
            if (typeof marked !== 'undefined') {
                contentHtml = marked.parse(content);
            }
            
            div.innerHTML = `
                <div class="avatar ${role}">${role === 'user' ? 'You' : 'AI'}</div>
                <div class="message-content">
                    ${imagesHtml}
                    ${contentHtml}
                </div>
            `;
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            if (typeof hljs !== 'undefined') {
                div.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            }
        }
        
        function addLoading() {
            const div = document.createElement('div');
            div.className = 'message';
            div.id = 'loading';
            div.innerHTML = `
                <div class="avatar assistant">AI</div>
                <div class="message-content">
                    <div class="loading"><span></span><span></span><span></span></div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function removeLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }
        
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && selectedImages.length === 0) return;
            
            const images = [...selectedImages];
            
            addMessage('user', text, images);
            messageHistory.push({ role: 'user', content: text });
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            selectedImages = [];
            renderImagePreviews();
            
            messageInput.disabled = true;
            sendBtn.disabled = true;
            addLoading();
            
            try {
                const content = [];
                content.push({ type: 'text', text: text || 'Analyze this image' });
                
                images.forEach(img => {
                    content.push({
                        type: 'image_url',
                        image_url: { url: img }
                    });
                });
                
                const messages = [
                    { role: 'system', content: 'You are a helpful AI assistant.' },
                    ...messageHistory.slice(-4).map(m => ({ role: m.role, content: m.content })),
                    { role: 'user', content: images.length > 0 ? content : text }
                ];
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'Seraph AI Chat'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: messages,
                        max_tokens: 8192
                    })
                });
                
                const data = await response.json();
                removeLoading();
                
                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    addMessage('assistant', reply);
                    messageHistory.push({ role: 'assistant', content: reply });
                } else {
                    addMessage('assistant', 'Error: ' + (data.error?.message || 'Unknown error'));
                }
            } catch (error) {
                removeLoading();
                addMessage('assistant', 'Error: ' + error.message);
            }
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }
    </script>
</body>
</html>
